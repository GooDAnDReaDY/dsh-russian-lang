name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-python не используется: офлайн-раннер не достаёт из кэша python 3.12.
      # Тесты инструментов — чистый stdlib, хватает системного python3 act-образа.
      - name: Node-тесты (словари/плюраль/типографика/раскладка)
        run: node --test test/test_plural.mjs test/test_fill.mjs test/test_count_plural.mjs test/test_typography.mjs test/test_layout.mjs
      - name: Репро загрузки бандла (mock ctx)
        run: node test/_repro.cjs
      - name: Тесты инструментов
        run: python3 test/test_tools.py
      - name: Сборка бандла + синтаксис
        run: |
          python3 build.py
          node --check lib/client.js
      - name: Coverage gate
        run: python3 check-coverage.py
      - name: Терминология (предупреждение, не блокер)
        run: python3 tools/term_check.py || true
      - name: Обезличенность исходников (словари переводов исключены — там чужие примеры)
        run: |
          ! grep -rniP '/mnt/|/home/(?!user/)[a-z]+|/opt/|192\.168\.[0-9]+\.[0-9]+|deepseekharness' README.md lib/ tools/*.py tools/systemd/ test/
      - name: Сборка npm-пакета (.tgz) для test server
        run: |
          mkdir -p /tmp/pkg
          npm pack --pack-destination /tmp/pkg
      - name: Загрузить артефакт
        uses: actions/upload-artifact@v3
        with:
          name: dsh-russian-lang-tgz
          path: /tmp/pkg/*.tgz
